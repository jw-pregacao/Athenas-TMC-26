<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Quadras - Athenas</title>
    <style>
        :root {
            --primary-color: #2e7d32; /* Verde mais elegante */
            --hover-color: #1b5e20;
            --bg-panel: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background-color: #f0f2f5;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 25px;
        }

        /* Estilo dos Botões */
        .accordion {
            background-color: var(--primary-color);
            color: white;
            cursor: pointer;
            padding: 15px 20px;
            width: 100%;
            border: none;
            text-align: left;
            outline: none;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
            margin-bottom: 5px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active, .accordion:hover {
            background-color: var(--hover-color);
        }

        /* Ícone de seta */
        .accordion:after {
            content: '\002B'; /* Sinal de + */
            font-weight: bold;
            float: right;
            margin-left: 5px;
        }

        .active:after {
            content: "\2212"; /* Sinal de - */
        }

        /* Painel de Conteúdo */
        .panel {
            padding: 0 18px;
            background-color: var(--bg-panel);
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out;
            margin-bottom: 10px;
            border-radius: 0 0 8px 8px;
        }

        .panel-content {
            padding: 15px 0;
        }

        .btn-link {
            display: inline-block;
            background-color: #fff;
            color: #1a73e8;
            padding: 10px 15px;
            text-decoration: none;
            border: 1px solid #dadce0;
            border-radius: 5px;
            font-weight: 500;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-link:hover {
            background-color: #f1f3f4;
            border-color: #1a73e8;
        }
    </style>
</head>
<body>

    <h2>📍 Menu de Quadras</h2>

    <button class="accordion">1.1 Sargento 1-A (Direita)</button>
    <div class="panel">
      <div class="panel-content">
        <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-direito.html" class="btn-link" target="_blank">🗺️ Abrir Mapa Direita</a>
      </div>
    </div>

    <button class="accordion">1.2 Passaúna 1-A</button>
    <div class="panel">
      <div class="panel-content">
        <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-passauna.html" class="btn-link" target="_blank">🗺️ Abrir Mapa Passaúna</a>
      </div>
    </div>

    <button class="accordion">1.3 Sargento 1-A (Esquerda)</button>
    <div class="panel">
      <div class="panel-content">
        <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-esquerdo.html" class="btn-link" target="_blank">🗺️ Abrir Mapa Esquerda</a>
      </div>
    </div>

    <script>
        var acc = document.getElementsByClassName("accordion");
        
        for (var i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                // Fecha todos os outros painéis antes de abrir o novo
                for (var j = 0; j < acc.length; j++) {
                    if (acc[j] !== this) {
                        acc[j].classList.remove("active");
                        acc[j].nextElementSibling.style.maxHeight = null;
                    }
                }

                // Alterna o painel clicado
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                }
            });
        }
    </script>

</body>
</html>
