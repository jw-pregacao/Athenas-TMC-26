<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu de Quadras</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #ffffff;
            --text: #333333;
        }

        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 15px;
            /* Impede seleção de texto acidental ao clicar rápido nos botões */
            user-select: none;
        }

        h2 {
            text-align: center;
            color: var(--text);
            font-size: 1.2rem;
        }

        .accordion {
            background-color: var(--primary);
            color: white;
            cursor: pointer;
            padding: 16px;
            width: 100%;
            border: none;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            transition: 0.2s;
        }

        .accordion:active {
            transform: scale(0.98); /* Efeito visual de clique */
            background-color: #1b5e20;
        }

        .panel {
            background-color: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .content {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .btn-link {
            text-decoration: none;
            background-color: #007bff;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>📍 Designação de Território</h2>

    <button class="accordion">1.1 Sargento 1-A (Direita) <span>+</span></button>
    <div class="panel">
        <div class="content">
            <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-direito.html" class="btn-link" target="_blank">VER MAPA</a>
        </div>
    </div>

    <button class="accordion">1.2 Passaúna 1-A <span>+</span></button>
    <div class="panel">
        <div class="content">
            <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-passauna.html" class="btn-link" target="_blank">VER MAPA</a>
        </div>
    </div>

    <button class="accordion">1.3 Sargento 1-A (Esquerda) <span>+</span></button>
    <div class="panel">
        <div class="content">
            <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-esquerdo.html" class="btn-link" target="_blank">VER MAPA</a>
        </div>
    </div>

    <script>
        const acc = document.getElementsByClassName("accordion");
        
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                // Fecha os outros
                for (let j = 0; j < acc.length; j++) {
                    if (acc[j] !== this) {
                        acc[j].nextElementSibling.style.maxHeight = null;
                        acc[j].querySelector('span').innerText = "+";
                    }
                }

                // Abre/Fecha o atual
                const panel = this.nextElementSibling;
                const span = this.querySelector('span');
                
                if (panel.style.maxHeight) {
                    panel.style.maxHeight = null;
                    span.innerText = "+";
                } else {
                    panel.style.maxHeight = panel.scrollHeight + "px";
                    span.innerText = "-";
                }
            });
        }
    </script>
</body>
</html>
