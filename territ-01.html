<!DOCTYPE html>
<html>
<head>
<style>
.button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  margin: 5px 0;
  border: none;
  cursor: pointer;
  width: 100%;
  text-align: left;
  font-size: 16px;
}

.panel {
  display: none;
  background-color: #f1f1f1;
  padding: 10px 15px;
  margin-bottom: 10px;
}

.panel a {
  display: block;
  padding: 5px 0;
  color: #0000EE;
  text-decoration: underline;
}
</style>
</head>
<body>

<h2>Menu de Quadras</h2>

<!-- Botão 1 -->
<button class="button" onclick="togglePanel('btn1')">1.1 Sargento 1-A (Direita)</button>
<div class="panel" id="btn1">
  <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-direito.html" target="_blank">Abrir Quadra 1A - Direita</a>
</div>

<!-- Botão 2 -->
<button class="button" onclick="togglePanel('btn2')">1.2 Passaúna 1-A</button>
<div class="panel" id="btn2">
  <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-passauna.html" target="_blank">Abrir Quadra 1A - Passaúna</a>
</div>

<!-- Botão 3 -->
<button class="button" onclick="togglePanel('btn3')">1.3 Sargento 1-A (Esquerda)</button>
<div class="panel" id="btn3">
  <a href="https://jw-pregacao.github.io/Athenas-TMC-26/quadra1a-esquerdo.html" target="_blank">Abrir Quadra 1A - Esquerda</a>
</div>

<script>
function togglePanel(id) {
  var panel = document.getElementById(id);
  panel.style.display = (panel.style.display === "block") ? "none" : "block";
}
</script>

</body>
</html>
